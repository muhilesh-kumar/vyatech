<div class="card">
    <div class="card-header"><i class="fa fa-align-justify"></i><strong>Standard Template</strong></div>

    <div class="card-body">
      
 <div class="container mt-4">
      <div class="row">
        <div class="col-md-4 mb-3" *ngFor="let card of data.cards">
          <div class="card h-100 shadow-sm">
            <div class="card-header text-center">
              {{ card.label }}
            </div>
            <div class="card-body text-center">
              <p class="card-text">{{ getCardValue(card.key) }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>


    </div>
</div>
