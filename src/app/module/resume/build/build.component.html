<body class="d-flex flex-column justify-content-center align-items-center vh-100 bg-white p-4">
  <h1 class="text-center mb-4">How do you want to build your resume?</h1>
  
  <div class="d-flex justify-content-center gap-4 w-100">
    <div class="card shadow-sm p-4" style="width: 300px; cursor: pointer;">
      <div class="card-body text-center"(click)=new()>
        <h3 class="card-title">Create a new Resume</h3>
        <p class="card-text mt-3">
          We will help you create a resume step-by-step
        </p>
      </div>
    </div>
    <div class="card shadow-sm p-4" style="width: 300px; cursor: pointer;">
      <div class="card-body text-center"(click)=new1()>
        <h3 class="card-title">I already have a resume</h3>
        <p class="card-text mt-3">
          We will re-format it and fill in your information so you don't have to.
        </p>
      </div>
    </div>
  </div>
</body>
