<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <i class="fa fa-align-justify"></i>Simple Table
          <i class="fa fa-plus float-right" style="cursor: pointer;" (click)="show()"></i>
        </div>
        <div class="card-body" style="overflow-y: auto; max-height: 400px;">
          <table class="table">

            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th> 
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of users">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.description }}</td>
                <td>{{ item.price }}</td>
                <td>{{ item.stock }}</td>
                <td>
                  <i style="color: green;" (click)="view(item.id)" class="fa fa-eye fa-lg"></i>&nbsp;&nbsp;
                  <i style="color:blue; cursor: pointer;" (click)="edit(item.id)" class="fa fa-edit"></i>&nbsp;&nbsp;
                  <i style="color: red;" data-bs-toggle="modal" [attr.data-bs-target]="'#exampleModal' + item.id"
                    class="fa fa-trash"></i>
                </td>

                <div class="modal fade" [id]="'exampleModal' + item.id" tabindex="-1"
                  aria-labelledby="exampleModalLabel" aria-hidden="true">
                  <div class="modal-dialog">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Delete Confirmation</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body">
                        Are you sure you want to delete <strong>{{ item.name }}</strong>?
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-danger" (click)="delete(item.id)"
                          data-bs-dismiss="modal">Delete</button>
                      </div>
                    </div>
                  </div>
                </div>
              </tr>



            </tbody>
          </table>


        </div>
      </div>
    </div>
  </div>
</div>


<p-dialog [header]="message" [(visible)]="showDialog" [modal]="true" [closable]="true" [style]="{width: '500px'}">
  <div class="form-wrapper">
    <form [formGroup]="userForm">

      <div class="row mb-3">
        <div class="col-6">
          <div class="form-floating">
            <input type="text" id="name" formControlName="name" class="form-control" placeholder="Product Name" />
            <label for="name">Products</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-floating">
            <input type="text" id="description" formControlName="description" class="form-control"
              placeholder="Description" />
            <label for="description">Description</label>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-6">
          <div class="form-floating">
            <input type="number" id="price" formControlName="price" class="form-control" placeholder="Price" min="0"
              max="10000" step="1" />
            <label for="price">Price</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-floating">
            <input type="number" id="stock" formControlName="stock" class="form-control" placeholder="Stock" min="0"
              max="10000" step="1" /> 
            <label for="stock">Stock</label>
          </div>
        </div> 
      </div>
      <div class="button-group mt-3 text-end">
        <button *ngIf="edited" type="button" class="btn btn-primary me-2" (click)="update()">Update</button>
        <button *ngIf="add" type="button" class="btn btn-primary me-2" (click)="addusers()">Add</button>
        <button type="button" class="btn btn-danger" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</p-dialog>
